name: Weapon sights
on:
  push:
    branches: [dev-3b-gpt]
  pull_request:
    paths:
      - 'code/cgame/**'
      - 'code/game/**'
      - 'assets/baseq3/**'
      - 'dev/tests/**'
      - 'dev/tools/build_sight_assets.js'
      - '.github/workflows/weapon-sights.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check generated optic assets
        run: |
          node dev/tools/build_sight_assets.js
          git diff --exit-code -- assets/baseq3
      - name: Test weapon state and sight presentation
        run: |
          mkdir -p out/tests
          cc -std=c99 -O0 -ffunction-sections -fdata-sections dev/tests/shotgun_reload_test.c code/game/bg_misc.c code/game/bg_slidemove.c code/qcommon/q_math.c code/qcommon/q_shared.c -Wl,--gc-sections -lm -o out/tests/weapon-test
          out/tests/weapon-test
          cc -std=c99 -O0 -ffunction-sections -fdata-sections dev/tests/sights_test.c code/qcommon/q_math.c code/qcommon/q_shared.c -Wl,--gc-sections -lm -o out/tests/sights-test
          out/tests/sights-test
      - name: Build native and QVM game modules
        run: |
          cmake -S . -B out/ci -DBUILD_CLIENT=OFF -DBUILD_SERVER=OFF -DBUILD_RENDERER_GL1=OFF -DBUILD_RENDERER_GL2=OFF -DBUILD_GAME_LIBRARIES=ON -DBUILD_GAME_QVMS=ON
          cmake --build out/ci --parallel 2
