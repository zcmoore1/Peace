name: Movement and weapon checks
on:
  push:
    branches: [dev-3b-gpt, dev-gpt]
  pull_request:
    paths:
      - 'code/cgame/**'
      - 'code/game/**'
      - 'code/q3_ui/**'
      - 'code/client/**'
      - 'code/server/**'
      - 'code/renderercommon/**'
      - 'code/renderergl1/**'
      - 'code/renderergl2/**'
      - 'code/qcommon/vm.c'
      - 'code/qcommon/vm_ptr.c'
      - 'code/qcommon/qcommon.h'
      - 'code/qcommon/q_shared.h'
      - 'code/qcommon/msg.c'
      - 'code/qcommon/common.c'
      - 'cmake/**'
      - 'assets/baseq3/**'
      - 'assets/source/spas12/**'
      - 'assets/source/m40a3/**'
      - 'dev/tests/**'
      - 'dev/tools/build_sight_assets.js'
      - 'dev/tools/build_ladder_map.py'
      - 'dev/tools/build_snd_assets.py'
      - 'dev/tools/build_semtex_assets.py'
      - 'dev/tools/import_spas.py'
      - 'dev/tools/build_spas_sprint.py'
      - 'dev/tools/build_m40a3.py'
      - '.github/workflows/weapon-sights.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check generated optic assets
        run: |
          node dev/tools/build_sight_assets.js
          git diff --exit-code -- assets/baseq3
      - name: Check generated ladder map
        run: python3 dev/tools/build_ladder_map.py --check
      - name: Check Search and Destroy objectives and round rules
        run: |
          python3 dev/tools/build_snd_assets.py --check
          sh dev/tests/run-snd.sh
          SND_TEST_DEFINES=-DMISSIONPACK sh dev/tests/run-snd.sh
          sh dev/tests/run-replay.sh
          REPLAY_TEST_FLAGS=-DMISSIONPACK sh dev/tests/run-replay.sh
      - name: Check SPAS mesh winding and clip metadata
        run: |
          python3 dev/tools/build_spas_sprint.py --check
          python3 dev/tests/spas_asset_test.py
      - name: Check scoped sniper assets and shared bolt/reload behavior
        run: |
          python3 dev/tools/build_m40a3.py --check
          python3 dev/tests/m40a3_asset_test.py
          sh dev/tests/run-sniper.sh
          SNIPER_TEST_FLAGS=-DMISSIONPACK sh dev/tests/run-sniper.sh
      - name: Test ladders against the real BSP collision engine
        run: |
          sh dev/tests/run-ladders.sh
          LADDER_TEST_DEFINES=-DMISSIONPACK sh dev/tests/run-ladders.sh
      - name: Test MW2's stance and prone through the real Pmove and server
        run: |
          sh dev/tests/run-stance.sh
          STANCE_TEST_FLAGS=-DMISSIONPACK sh dev/tests/run-stance.sh
      - name: Test weapon state and sight presentation
        run: |
          mkdir -p out/tests
          cc -std=c99 -O0 -ffunction-sections -fdata-sections dev/tests/shotgun_reload_test.c code/game/bg_loadout.c code/game/bg_misc.c code/game/bg_slidemove.c code/qcommon/q_math.c code/qcommon/q_shared.c -Wl,--gc-sections -lm -o out/tests/weapon-test
          out/tests/weapon-test
          cc -std=c99 -O0 -ffunction-sections -fdata-sections dev/tests/sights_test.c code/game/bg_pmove.c code/game/bg_loadout.c code/game/bg_misc.c code/game/bg_slidemove.c code/qcommon/q_math.c code/qcommon/q_shared.c -Wl,--gc-sections -lm -o out/tests/sights-test
          out/tests/sights-test
      - name: Test saved classes, YY, quick actions, poses and network deltas
        run: |
          sh dev/tests/run-perks.sh
          PERK_TEST_FLAGS=-DMISSIONPACK sh dev/tests/run-perks.sh
          python3 dev/tools/build_semtex_assets.py --check
          sh dev/tests/run-loadouts.sh
          LOADOUT_TEST_FLAGS=-DMISSIONPACK sh dev/tests/run-loadouts.sh
          sh dev/tests/run-pickups.sh
          PICKUP_TEST_FLAGS=-DMISSIONPACK sh dev/tests/run-pickups.sh
          sh dev/tests/run-fakereload.sh
          FAKERELOAD_TEST_FLAGS=-DMISSIONPACK sh dev/tests/run-fakereload.sh
          sh dev/tests/run-kick.sh
          KICK_TEST_FLAGS=-DMISSIONPACK sh dev/tests/run-kick.sh
          sh dev/tests/run-bullets.sh
          BULLETS_TEST_FLAGS=-DMISSIONPACK sh dev/tests/run-bullets.sh
          sh dev/tests/run-silentshot.sh
          SILENTSHOT_TEST_FLAGS=-DMISSIONPACK sh dev/tests/run-silentshot.sh
      - name: Test MW2's stance button, its cgame half and the stance end to end
        run: |
          sh dev/tests/run-stanceinput.sh
          STANCEINPUT_TEST_FLAGS=-DMISSIONPACK sh dev/tests/run-stanceinput.sh
          sh dev/tests/run-stancecgame.sh
          STANCECGAME_TEST_FLAGS=-DMISSIONPACK sh dev/tests/run-stancecgame.sh
          sh dev/tests/run-stanceflow.sh
          STANCEFLOW_TEST_FLAGS=-DMISSIONPACK sh dev/tests/run-stanceflow.sh
      - name: Test the viewmodel's skeletal pose in both renderers
        run: |
          sh dev/tests/run-iqmpose.sh
      - name: Build native and QVM game modules
        run: |
          cmake -S . -B out/ci -DBUILD_CLIENT=OFF -DBUILD_SERVER=OFF -DBUILD_RENDERER_GL1=OFF -DBUILD_RENDERER_GL2=OFF -DBUILD_GAME_LIBRARIES=ON -DBUILD_GAME_QVMS=ON
          cmake --build out/ci --parallel 2
