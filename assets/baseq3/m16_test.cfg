// Optional local test setup: M16/Masterkey + SPAS on the ladder map.
// Chooses the next-spawn loadout without overwriting any saved custom class.
set peace_loadout "2|18|3|12|1|13|2|0|0|0|0|0|M16 Test"
bind b "weapalt"
bind PAD0_DPAD_DOWN "weapalt"
devmap peace_ladder
echo "M16 test: B / D-pad down switches rifle and Masterkey. Y swaps inventory slots."
echo "Original prototype: automatic rifle, 4-shell pump shotgun, separate ammo."
