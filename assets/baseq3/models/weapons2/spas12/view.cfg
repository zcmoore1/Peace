// SPAS-12 viewmodel clip table.  name firstFrame numFrames fps loop
//
// The source pack has no .qc declaring a frame rate. Fire and reload keep
// their existing inferred 60fps playback. Normal draw and holster instead
// use the MW2 multiplayer spas12_mp weapon definition's raise/drop times:
// https://github.com/FreeTheTech101/IW4-Dump-Files/blob/master/weapons/mp/spas12_mp
//
// These lengths are the SAME numbers as the gameplay timers in bg_pmove.c, so
// the picture and the weapon state machine agree by construction:
//   raise        1075 = bg_weaponRaiseTime[WP_SHOTGUN]
//   drop          829 = bg_weaponDropTime[WP_SHOTGUN]
//   fire          633 = the WP_SHOTGUN refire in PM_Weapon
//   reload_start  283 | reload_loop 417 | reload_end 533 = bg_weaponReloads
//
// drop follows the draw backwards (the pack has no holster), resampled with
// ease-out progress f*(2-f) so its initial movement is visible during quick YY.
// The 26-frame range, endpoints and 829ms duration are unchanged.
// YY still cancels the draw.
// The move layer still fits this clip to the universal 100ms ladder holster.
//
// Original sprint motion is baked from assets/source/spas12/sprint.json:
//   sprint_in 200ms -> sprint_loop 600ms repeating -> sprint_out 250ms.
// Entry/exit share endpoint poses with idle and carry. Entry is NON-looping;
// carry is looping. Those flags preserve the existing IW4 still-swap rule.
// first_raise is an optional, once-per-acquisition draw/check. Its authored
// composition is in first_raise.json; interrupting it is an ordinary holster.
