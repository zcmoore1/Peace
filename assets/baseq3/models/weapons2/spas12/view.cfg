// SPAS-12 viewmodel clip table.  name firstFrame numFrames fps loop
//
// 60fps, not the 30 the importer originally assumed. The pack ships no .qc to
// state a rate, so it has to be inferred from what the numbers mean:
//   fire   38f -> 633ms at 60, 1267ms at 30. MW2's SPAS fires about 1.7 times
//                 a second; 30fps would make it slower than one shot a second.
//   raise  26f -> 433ms at 60, 866ms at 30. Nearly a second to bring a shotgun
//                 up is not an MW2 draw.
// Both land on MW2's cadence at 60 and nowhere near it at 30.
//
// These lengths are the SAME numbers as the gameplay timers in bg_pmove.c, so
// the picture and the weapon state machine agree by construction:
//   raise         433 = bg_weaponRaiseTime[WP_SHOTGUN]
//   fire          633 = the WP_SHOTGUN refire in PM_Weapon
//   reload_start  283 | reload_loop 417 | reload_end 533 = bg_weaponReloads
//
// drop is the ONLY clip that does not agree: it is synthetic (the draw played
// backwards - the pack has no holster) and runs 433ms against a 200ms holster,
// so it plays about twice speed. A fast holster reads fine, but when a real
// drop is authored, set its length and bg_weaponDropTime to the same number.
//
// Not here at all: sprint_in, sprint_loop, sprint_out. Nothing was authored for
// them, so the gun plays idle while sprinting. When they exist, sprint_in must
// be NON-looping and sprint_loop looping - that one flag is what makes the IW4
// still swap hold on its final frame instead of restarting.
idle 0 11 60 1
raise 11 26 60 0
fire 37 38 60 0
reload_start 75 17 60 0
reload_loop 92 25 60 0
reload_end 117 32 60 0
drop 149 26 60 0
