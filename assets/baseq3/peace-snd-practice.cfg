// Solo objective practice; separate from normal multiplayer rules.
// Run "exec peace-snd-practice" from the console. Use = F by default.
set g_gametype 8
set g_sndPractice 1
set g_sndRoundTime 150
set g_sndBombTime 45
set g_sndPlantTime 5
set g_sndDefuseTime 5
set g_sndWinLimit 4
set g_sndSwitchRounds 3
set g_sndCountdown 5
set g_sndRoundPause 5
set g_localTeamPref red
devmap peace_ladder
