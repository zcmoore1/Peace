// ===========================================================================
// Peace - developer autoexec
// ===========================================================================
// Forces the engine to load your freshly built NATIVE game modules
// (cgame.dll / qagame.dll / ui.dll) instead of the vanilla QVMs baked into
// pak0.pk3.
//
// This file is exec'd on every launch AFTER q3config.cfg, so it overrides the
// archived vm_* values (which default to 2 = vanilla interpreted QVM) and can
// never silently regress.
//
// Copy this file next to your built DLLs and RENAME it to autoexec.cfg:
//   out/build/x64-Debug/Debug/baseq3/autoexec.cfg
// (It is tracked here as peace-autoexec.cfg because the repo .gitignore
//  excludes every file literally named autoexec.cfg.)
// ===========================================================================

// 0 = native DLL   1 = compiled QVM   2 = interpreted QVM (vanilla)
seta vm_game  0
seta vm_cgame 0
seta vm_ui    0

// Pure servers ignore loose DLLs/QVMs and force the pak QVMs. Off for dev.
seta sv_pure 0

// Let local dev/test commands (give, noclip, etc.) work.
seta sv_cheats 1

// High server tick rate: tightens the window between input and pmove processing.
// At 20Hz (default) there is up to 50ms of tick-boundary delay on fast inputs
// like the YY double-tap. 125Hz drops that to ~8ms - effectively instant.
seta sv_fps 125

// CoD-style controls: sprint (shift) and aim-down-sights (right mouse).
bind SHIFT  "+sprint"
bind MOUSE2 "+ads"
bind v      "+melee"
bind g      "+lethal"
bind q      "+tactical"
bind f      "+use"

// ---------------------------------------------------------------------------
// Logging / diagnostics
// ---------------------------------------------------------------------------
// logfile 2 flushes every line as it is written, so the log SURVIVES A HARD
// CRASH. logfile 1 buffers and loses exactly the lines you need. The file is
// qconsole.log in the HOMEPATH, not the build dir:
//   Windows  %APPDATA%\Quake3\baseq3\qconsole.log
seta logfile 2
seta con_notifytime 5

// F11 = dump weapon/loadout state and write the whole console to a file.
// The file lands next to qconsole.log in the homepath above.
bind F11 "peacedump; condump peacedump.txt"

// Xbox / XInput controller layout. Comment this line out to play mouse-only;
// the keyboard binds above are unaffected either way.
exec peace-gamepad.cfg

echo "^2[Peace] autoexec loaded -- native modules, sv_pure 0"
