// ===========================================================================
// Peace - Xbox controller layout
// ===========================================================================
// The engine already has native SDL_GameController support, so an Xbox One /
// Series pad (and any XInput-compatible pad) is detected without a driver or a
// mapping file. It ships DISABLED and unbound, which is all this file fixes.
//
// exec'd from peace-autoexec.cfg. To use it standalone:  exec peace-gamepad
// ===========================================================================

// --- enable ---------------------------------------------------------------
// in_joystick is CVAR_LATCH: it takes effect because this runs at startup.
// If you toggle it later from the console, run in_restart to apply it.
seta in_joystick          1
seta in_joystickNo        0
seta in_joystickUseAnalog 1      // 1 = true analog sticks, 0 = digital 8-way

// Deadzones. A game pad's sticks use MW2's radial deadzone (IW4x's values):
// under gpad_stick_deadzone_min the stick reads nothing, past 1 - max it
// reads full, and a diagonal keeps its direction. Raise min if a stick
// creeps while you stand still. joy_threshold is now only where a trigger
// presses (and older, non-game-pad joysticks' deadzone): 0.13 is IW4x's
// gpad_button_deadzone. in_joystickThreshold is only the C variable's name;
// setting that cvar does nothing.
seta gpad_stick_deadzone_min 0.2
seta gpad_stick_deadzone_max 0.01
seta joy_threshold           0.13

// --- analog axis routing --------------------------------------------------
// SDL axis order for a gamepad: 0 = LeftX, 1 = LeftY, 2 = RightX, 3 = RightY.
// These already match an Xbox pad, so left stick moves and right stick looks.
seta j_side_axis     0
seta j_forward_axis  1
seta j_yaw_axis      2
seta j_pitch_axis    3
seta j_up_axis       4

// Movement. Signs set the direction - flip a sign to invert that axis. A
// move saturates at 127, so at 1.0 any push past the deadzone is full
// speed; 0.003876 (127 / 32767) would make the speed follow the stick.
seta j_forward  -1.0
seta j_side      1.0
seta j_up        0

// --- look: MW2's game pad aim (code/client/cl_gamepadaim.c) ----------------
// The look stick turns at MW2's own turn rates (dvars in MW2's exe, which
// IW4x's controller code first looked up with Dvar_FindVar) times
// input_viewSensitivity, leaning toward the ADS rates as the gun comes up,
// with MW2's dominant-axis scale and its ramp to full speed
// (aim_accel_turnrate_lerp * sensitivity deg/s^2: 217ms at any setting).
//
// input_viewSensitivity is the console's Look Sensitivity (IW4x's preset
// table, pc_options_gamepad.menu). Full-tilt turn in deg/s:
//   MW2   mult   hip yaw/pitch   ADS yaw/pitch
//    1    0.6     156 /  54       54 / 33     (Low)
//    2    1.0     260 /  90       90 / 55     (Medium)
//    3    1.4     364 / 126      126 / 77
//    4    1.8     468 / 162      162 / 99     (High)
//    5    2.0     520 / 180      180 / 110
//    6    2.2     572 / 198      198 / 121
//    7    2.6     676 / 234      234 / 143    (Very High)
//    8    3.0     780 / 270      270 / 165
//    9    3.5     910 / 315      315 / 192.5
//   10    4.0    1040 / 360      360 / 220    (Insane)
seta j_mw2Aim                   1     // 0: Quake's linear look by j_yaw / j_pitch
seta input_viewSensitivity      4.0   // MW2 sensitivity 10, "Insane"
seta aim_turnrate_yaw           260   // MW2's own values from here down
seta aim_turnrate_pitch         90
seta aim_turnrate_yaw_ads       90
seta aim_turnrate_pitch_ads     55
seta aim_accel_turnrate_enabled 1
seta aim_accel_turnrate_lerp    1200
seta aim_scale_view_axis        1
seta aim_input_graph_enabled    1
// MW2 also shapes partial deflection with its aim graph 3 (aaInputGraph,
// 0x7A2FC0 in iw4mp.exe), whose knots have not been read out of the game
// yet, so the look is linear in the stick. Once they are, set them in the
// console (not here: this file runs every launch and would clear them):
//   seta aim_input_graph "fraction value ..."; seta aim_input_graph_scale <scale>
// Not ported: aim assist slowdown, and MW2's fovTurnRateScale
// (AimAssist_UpdateTweakables, 0x569950), which is 1 here.

// With j_mw2Aim on, j_yaw and j_pitch only give each axis its direction.
// Their sizes are sensitivity 10's hip speeds for j_mw2Aim 0, where the
// view turns |j| * 32767 deg/s at full deflection: 1040 and 360.
seta j_pitch     0.010987 // for inverted look, use  seta j_pitch -0.010987
seta j_yaw      -0.031739

// --- stick directions -----------------------------------------------------
// These binds are NOT optional in analog mode. The engine decides which analog
// axis a stick drives by reading what its direction is bound to (see
// KeyToAxisAndSign in sdl_input.c), so removing them disables analog entirely.
bind PAD0_LEFTSTICK_UP      "+forward"
bind PAD0_LEFTSTICK_DOWN    "+back"
bind PAD0_LEFTSTICK_LEFT    "+moveleft"
bind PAD0_LEFTSTICK_RIGHT   "+moveright"

bind PAD0_RIGHTSTICK_UP     "+lookup"
bind PAD0_RIGHTSTICK_DOWN   "+lookdown"
bind PAD0_RIGHTSTICK_LEFT   "+left"
bind PAD0_RIGHTSTICK_RIGHT  "+right"

// --- Peace control scheme (MW2 Tactical layout) ---------------------------
// Tactical is MW2's default with melee and crouch swapped: melee on B,
// crouch on the right stick click.
// Triggers report as a one-way axis and cross into a keypress at the deadzone,
// so they bind exactly like buttons.
bind PAD0_RIGHTTRIGGER      "+attack"      // RT - fire
bind PAD0_LEFTTRIGGER       "+ads"         // LT - aim down sights

bind PAD0_RIGHTSHOULDER     "+lethal"      // RB - lethal
bind PAD0_LEFTSHOULDER      "+tactical"    // LB - non-lethal

bind PAD0_A                 "+moveup"      // A  - jump
bind PAD0_B                 "+melee"       // B  - knife
bind PAD0_X                 "+usereload"   // X  - use/reload, as on console MW2 (tap reloads, hold picks up/plants)
bind PAD0_Y                 "weapnext"     // Y  - swap weapon (this is the YY)

bind PAD0_LEFTSTICK_CLICK   "+sprint"      // LS - sprint
bind PAD0_RIGHTSTICK_CLICK  "+movedown"    // RS - crouch (Tactical: melee is on B)

bind PAD0_DPAD_UP           "+use"         // use: picks up a gun or knife at once (X needs a 250ms hold)
bind PAD0_DPAD_DOWN         "+button3"     // gesture (BUTTON_GESTURE; there is no +gesture command)
bind PAD0_DPAD_LEFT         "ui_classes"    // select a saved class
bind PAD0_DPAD_RIGHT        "ui_createclass" // edit the selected custom class

bind PAD0_START             "togglemenu"
bind PAD0_BACK              "+scores"

echo "^2[Peace] gamepad layout loaded -- MW2 Tactical: RT fire, LT ads, B melee, RS crouch, LS sprint"
