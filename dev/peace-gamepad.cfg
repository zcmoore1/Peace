// ===========================================================================
// Peace - Xbox controller layout
// ===========================================================================
// The engine already has native SDL_GameController support, so an Xbox One /
// Series pad (and any XInput-compatible pad) is detected without a driver or a
// mapping file. It ships DISABLED and unbound, which is all this file fixes.
//
// exec'd from peace-autoexec.cfg. To use it standalone:  exec peace-gamepad
// ===========================================================================

// --- enable ---------------------------------------------------------------
// in_joystick is CVAR_LATCH: it takes effect because this runs at startup.
// If you toggle it later from the console, run in_restart to apply it.
seta in_joystick          1
seta in_joystickNo        0
seta in_joystickUseAnalog 1      // 1 = true analog sticks, 0 = digital 8-way

// Stick deadzone as a fraction of full deflection. Xbox sticks drift, so a
// little is required; raise toward 0.20 if you see creep while standing still.
// The engine reads joy_threshold (sdl_input.c); in_joystickThreshold is only
// the C variable's name, so setting that cvar does nothing. 0.20 is IW4x's
// inner stick deadzone (gpad_stick_deadzone_min); PC MW2 has none of its own.
seta joy_threshold 0.20

// --- analog axis routing --------------------------------------------------
// SDL axis order for a gamepad: 0 = LeftX, 1 = LeftY, 2 = RightX, 3 = RightY.
// These already match an Xbox pad, so left stick moves and right stick looks.
seta j_side_axis     0
seta j_forward_axis  1
seta j_yaw_axis      2
seta j_pitch_axis    3
seta j_up_axis       4

// Sensitivity. Signs set the direction - flip a sign to invert that axis.
// Movement at 1.0 means full deflection is full speed.
seta j_forward  -1.0
seta j_side      1.0
seta j_up        0

// Look is MW2's console sensitivity 10 ("Insane"). The engine turns
// |j| * 32767 degrees per second at full deflection (CL_JoystickMove), so
// j = MW2 turn rate / 32767. The turn rates are dvars in MW2's own exe
// (aim_turnrate_yaw 260, aim_turnrate_pitch 90; IW4x's controller code
// first looked them up with Dvar_FindVar), times input_viewSensitivity from
// IW4x's console preset table (pc_options_gamepad.menu), which is 4.0 at 10.
//
//   MW2   mult   deg/s yaw/pitch   j_yaw       j_pitch
//    1    0.6     156 /  54        -0.004761   0.001648   (Low)
//    2    1.0     260 /  90        -0.007935   0.002747   (Medium)
//    3    1.4     364 / 126        -0.011109   0.003845
//    4    1.8     468 / 162        -0.014283   0.004944   (High)
//    5    2.0     520 / 180        -0.015870   0.005493
//    6    2.2     572 / 198        -0.017457   0.006043
//    7    2.6     676 / 234        -0.020631   0.007141   (Very High)
//    8    3.0     780 / 270        -0.023804   0.008240
//    9    3.5     910 / 315        -0.027772   0.009613
//   10    4.0    1040 / 360        -0.031739   0.010987   (Insane)
//
// Not mirrored, because the engine's stick path has no place for them: MW2
// ramps to full speed at 1200 * mult deg/s^2 (217ms at any setting), shapes
// partial deflection with its aim graph 3, and slows aim down sights to
// 90 / 55 deg/s times mult. Peace turns linearly, at once, and the same
// aimed or not.
seta j_pitch     0.010987 // for inverted look, use  seta j_pitch -0.010987
seta j_yaw      -0.031739

// --- stick directions -----------------------------------------------------
// These binds are NOT optional in analog mode. The engine decides which analog
// axis a stick drives by reading what its direction is bound to (see
// KeyToAxisAndSign in sdl_input.c), so removing them disables analog entirely.
bind PAD0_LEFTSTICK_UP      "+forward"
bind PAD0_LEFTSTICK_DOWN    "+back"
bind PAD0_LEFTSTICK_LEFT    "+moveleft"
bind PAD0_LEFTSTICK_RIGHT   "+moveright"

bind PAD0_RIGHTSTICK_UP     "+lookup"
bind PAD0_RIGHTSTICK_DOWN   "+lookdown"
bind PAD0_RIGHTSTICK_LEFT   "+left"
bind PAD0_RIGHTSTICK_RIGHT  "+right"

// --- Peace control scheme (MW2 Tactical layout) ---------------------------
// Tactical is MW2's default with melee and crouch swapped: melee on B,
// crouch on the right stick click.
// Triggers report as a one-way axis and cross into a keypress at the deadzone,
// so they bind exactly like buttons.
bind PAD0_RIGHTTRIGGER      "+attack"      // RT - fire
bind PAD0_LEFTTRIGGER       "+ads"         // LT - aim down sights

bind PAD0_RIGHTSHOULDER     "+lethal"      // RB - lethal
bind PAD0_LEFTSHOULDER      "+tactical"    // LB - non-lethal

bind PAD0_A                 "+moveup"      // A  - jump
bind PAD0_B                 "+melee"       // B  - knife
bind PAD0_X                 "+usereload"   // X  - use/reload, as on console MW2 (tap reloads, hold picks up/plants)
bind PAD0_Y                 "weapnext"     // Y  - swap weapon (this is the YY)

bind PAD0_LEFTSTICK_CLICK   "+sprint"      // LS - sprint
bind PAD0_RIGHTSTICK_CLICK  "+movedown"    // RS - crouch (Tactical: melee is on B)

bind PAD0_DPAD_UP           "+use"         // use: picks up a gun or knife at once (X needs a 250ms hold)
bind PAD0_DPAD_DOWN         "+button3"     // gesture (BUTTON_GESTURE; there is no +gesture command)
bind PAD0_DPAD_LEFT         "ui_classes"    // select a saved class
bind PAD0_DPAD_RIGHT        "ui_createclass" // edit the selected custom class

bind PAD0_START             "togglemenu"
bind PAD0_BACK              "+scores"

echo "^2[Peace] gamepad layout loaded -- MW2 Tactical: RT fire, LT ads, B melee, RS crouch, LS sprint"
